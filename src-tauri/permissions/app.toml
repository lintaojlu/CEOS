[[permission]]
identifier = "allow-append-agent-log"
description = "Append one line to the developer agent log"
commands.allow = ["append_agent_log"]

[[permission]]
identifier = "allow-agent-store"
description = "Read and append agent conversation transcripts"
commands.allow = ["read_agent_index", "write_agent_index", "read_agent_session", "append_agent_session", "delete_agent_session"]
